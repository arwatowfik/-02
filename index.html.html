<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dodge Challenger</title>
<style>
:root{--bg:#f4f2ef;--card:#fff;--tx:#17171a;--mut:#666;--ac:#e8590c;--ln:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--card:#18181d;--tx:#f2f2f2;--mut:#9a9aa3;--ln:#2c2c34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e11;--card:#18181d;--tx:#f2f2f2;--mut:#9a9aa3;--ln:#2c2c34;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-weight:800;letter-spacing:2px;color:var(--ac)}
.lang button{background:var(--card);color:var(--tx);border:1px solid var(--ln);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.lang button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:clamp(2rem,7vw,3.6rem);margin:8px 0;line-height:1.1}
h2{margin:32px 0 12px;border-inline-start:4px solid var(--ac);padding-inline-start:10px}
.sub{color:var(--mut);max-width:60ch}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}
#v3d{width:100%;height:min(60vh,420px);border-radius:14px;background:linear-gradient(#2b2b33,#0d0d10);touch-action:pan-y;cursor:grab;position:relative;overflow:hidden}
#v3d canvas{display:block;width:100%;height:100%}
.hint{position:absolute;bottom:8px;inset-inline:0;text-align:center;color:#bbb;font-size:.8rem;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--ln)}
td:last-child{font-weight:700;text-align:end}
.price{font-size:2rem;font-weight:800;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{color:var(--mut);font-size:.85rem}
svg.car{width:100%;height:auto}
footer{text-align:center;color:var(--mut);padding:28px 16px;border-top:1px solid var(--ln);margin-top:36px}
</style>
</head>
<body>
<header>
 <div class="logo">T.H.D</div>
 <div class="lang"><button data-l="ar" class="on">العربية</button> <button data-l="fr">FR</button> <button data-l="en">EN</button></div>
</header>
<main>
 <p class="sub" data-i="tag"></p>
 <h1>Dodge Challenger</h1>
 <p class="sub" data-i="intro"></p>

 <h2 data-i="h3d"></h2>
 <div id="v3d"><div class="hint" data-i="hint"></div></div>
 <div class="row"><span data-i="color"></span>
  <span class="sw" data-c="#7b2fbf" style="background:#7b2fbf" title="Plum Crazy"></span>
  <span class="sw" data-c="#ff6a00" style="background:#ff6a00" title="Go Mango"></span>
  <span class="sw" data-c="#c1121f" style="background:#c1121f" title="TorRed"></span>
  <span class="sw" data-c="#1f6feb" style="background:#1f6feb" title="B5 Blue"></span>
  <span class="sw" data-c="#22252b" style="background:#22252b" title="Pitch Black"></span>
 </div>
 <p class="note" data-i="note3d"></p>

 <h2 data-i="himg"></h2>
 <div class="card">
  <svg class="car" viewBox="0 0 600 200" role="img" aria-label="Dodge Challenger">
   <path d="M30 140 L40 112 Q60 100 120 96 L205 60 Q235 48 290 48 L370 52 Q410 60 440 92 L545 104 Q575 112 580 140 Z" fill="var(--ac)"/>
   <path d="M215 66 L240 56 L285 55 L285 94 L195 94 Z M300 55 L365 58 Q392 66 410 94 L300 94 Z" fill="#9fd3ff" opacity=".85"/>
   <rect x="30" y="134" width="550" height="10" fill="#000" opacity=".25"/>
   <circle cx="140" cy="146" r="32" fill="#111"/><circle cx="140" cy="146" r="16" fill="#aaa"/>
   <circle cx="470" cy="146" r="32" fill="#111"/><circle cx="470" cy="146" r="16" fill="#aaa"/>
  </svg>
  <div class="row"><label data-i="up"></label> <input type="file" accept="image/*" id="photo"></div>
  <img id="pic" alt="" style="display:none;max-width:100%;border-radius:12px;margin-top:10px">
 </div>

 <h2 data-i="hspec"></h2>
 <div class="card">
  <div class="tabs" id="tabs"></div>
  <div class="price" id="price"></div>
  <div class="tw"><table id="tbl"></table></div>
  <p class="note" data-i="pnote"></p>
 </div>

 <h2 data-i="hdim"></h2>
 <div class="card tw"><table id="dim"></table></div>

 <h2 data-i="hhist"></h2>
 <div class="grid" id="hist"></div>

 <h2 data-i="hdz"></h2>
 <div class="card"><p data-i="dz"></p></div>
</main>
<footer>© T.H.D — <span data-i="foot"></span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T={
ar:{tag:"سيارة العضلات الأمريكية الأسطورية",intro:"دودج تشالنجر سيارة كوبيه أمريكية عالية الأداء من شركة دودج (مجموعة ستيلانتس). ظهرت لأول مرة سنة 1970، وعادت سنة 2008 بتصميم كلاسيكي ومحركات HEMI V8 قوية. توقف إنتاجها نهاية 2023.",h3d:"عرض ثلاثي الأبعاد",hint:"اسحب لتدوير السيارة",color:"اللون:",note3d:"مجسم مبسّط مبرمج بالكود، وليس نموذجا مطابقا للسيارة الحقيقية.",himg:"صورة السيارة",up:"ارفع صورتك للسيارة:",hspec:"الفئات والمواصفات",pnote:"الأسعار تقريبية (سعر المصنّع الأمريكي لموديلات 2023) وتختلف حسب السنة والسوق. تحقق منها قبل الاعتماد عليها.",hdim:"الأبعاد (تقريبية)",hhist:"التاريخ",hdz:"في الجزائر",dz:"استيراد السيارات إلى الجزائر تحكمه قوانين وشروط (عمر السيارة، الجمارك، الرسوم) تتغير باستمرار. تحقق من آخر القرارات الرسمية قبل أي عملية شراء أو استيراد.",foot:"جميع الحقوق محفوظة",
 rows:["المحرك","القوة","العزم","0-100 كم/س","السرعة القصوى","ناقل الحركة","الدفع","السعر التقريبي"],
 dim:[["الطول","5,022 مم"],["العرض","1,923 مم"],["الارتفاع","1,448 مم"],["قاعدة العجلات","2,946 مم"],["الوزن","1,800 – 2,050 كغ"]],
 hist:[["1970","الجيل الأول: ظهر كمنافس لفورد موستانغ وشيفروليه كامارو."],["2008","العودة بتصميم مستوحى من طراز 1970 على منصة LX."],["2015","ظهور هيلكات بمحرك 6.2L مزوّد بشاحن بقوة 707 حصان."],["2018","ظهور ديمون بقوة تصل إلى 840 حصان."],["2023","نهاية الإنتاج وإصدارات Last Call، وآخرها ديمون 170 بقوة 1,025 حصان."]]},
fr:{tag:"La légende américaine des muscle cars",intro:"La Dodge Challenger est un coupé sportif américain de Dodge (groupe Stellantis). Née en 1970, relancée en 2008 avec un style rétro et des V8 HEMI puissants. La production s'est arrêtée fin 2023.",h3d:"Vue 3D",hint:"Glissez pour faire tourner la voiture",color:"Couleur :",note3d:"Maquette simplifiée générée par code, pas un modèle exact de la vraie voiture.",himg:"Photo",up:"Ajoutez votre photo de la voiture :",hspec:"Versions et caractéristiques",pnote:"Prix approximatifs (tarif constructeur US, millésime 2023), variables selon l'année et le marché. À vérifier.",hdim:"Dimensions (approx.)",hhist:"Histoire",hdz:"En Algérie",dz:"L'importation de véhicules en Algérie est soumise à des règles (âge du véhicule, douane, taxes) qui évoluent souvent. Vérifiez les dernières décisions officielles avant tout achat ou import.",foot:"Tous droits réservés",
 rows:["Moteur","Puissance","Couple","0-100 km/h","Vitesse max","Boîte","Transmission","Prix approx."],
 dim:[["Longueur","5 022 mm"],["Largeur","1 923 mm"],["Hauteur","1 448 mm"],["Empattement","2 946 mm"],["Poids","1 800 – 2 050 kg"]],
 hist:[["1970","1re génération, rivale de la Ford Mustang et de la Chevrolet Camaro."],["2008","Retour avec un design inspiré de 1970 sur plateforme LX."],["2015","Arrivée de la Hellcat, V8 6.2L suralimenté de 707 ch."],["2018","La Demon, jusqu'à 840 ch."],["2023","Fin de production et éditions Last Call, dont la Demon 170 de 1 025 ch."]]},
en:{tag:"The legendary American muscle car",intro:"The Dodge Challenger is a high-performance American coupe from Dodge (Stellantis). Introduced in 1970 and revived in 2008 with retro styling and powerful HEMI V8 engines. Production ended in late 2023.",h3d:"3D View",hint:"Drag to rotate the car",color:"Color:",note3d:"A simplified code-built model, not an exact replica of the real car.",himg:"Photo",up:"Add your own car photo:",hspec:"Trims & Specs",pnote:"Prices are approximate (US MSRP, 2023 model year) and vary by year and market. Please verify.",hdim:"Dimensions (approx.)",hhist:"History",hdz:"In Algeria",dz:"Importing vehicles into Algeria is governed by rules (vehicle age, customs, taxes) that change often. Check the latest official decisions before buying or importing.",foot:"All rights reserved",
 rows:["Engine","Power","Torque","0-100 km/h","Top speed","Gearbox","Drive","Approx. price"],
 dim:[["Length","5,022 mm"],["Width","1,923 mm"],["Height","1,448 mm"],["Wheelbase","2,946 mm"],["Weight","1,800 – 2,050 kg"]],
 hist:[["1970","First generation, rival to the Ford Mustang and Chevrolet Camaro."],["2008","Revival with 1970-inspired styling on the LX platform."],["2015","Hellcat arrives: supercharged 6.2L V8 with 707 hp."],["2018","The Demon, up to 840 hp."],["2023","End of production and Last Call editions, including the 1,025 hp Demon 170."]]}
};
const TR=[
 {n:"SXT",v:["3.6L V6","≈ 305 hp","≈ 363 N·m","≈ 6.0 s","≈ 210 km/h","8-speed auto","RWD / AWD","≈ $33,000"]},
 {n:"R/T",v:["5.7L HEMI V8","375 hp","556 N·m","≈ 5.0 s","≈ 250 km/h","6-speed manual / 8-speed auto","RWD","≈ $40,000"]},
 {n:"R/T Scat Pack",v:["6.4L HEMI V8","485 hp","644 N·m","≈ 4.2 s","≈ 281 km/h","6-speed manual / 8-speed auto","RWD","≈ $44,000"]},
 {n:"SRT Hellcat Redeye",v:["6.2L V8 Supercharged","797 hp","959 N·m","≈ 3.4 s","≈ 327 km/h","6-speed manual / 8-speed auto","RWD","≈ $72,000"]}
];
let L="ar",ti=1;
function fill(){
 const t=T[L];
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 document.getElementById("tabs").innerHTML=TR.map((x,i)=>`<button class="${i===ti?"on":""}" data-t="${i}">${x.n}</button>`).join("");
 const x=TR[ti];
 document.getElementById("price").textContent=x.v[7];
 document.getElementById("tbl").innerHTML=t.rows.map((r,i)=>`<tr><td>${r}</td><td>${x.v[i]}</td></tr>`).join("");
 document.getElementById("dim").innerHTML=t.dim.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
 document.getElementById("hist").innerHTML=t.hist.map(h=>`<div class="card"><b style="color:var(--ac);font-size:1.4rem">${h[0]}</b><br>${h[1]}</div>`).join("");
}
document.querySelector(".lang").onclick=e=>{if(e.target.dataset.l){L=e.target.dataset.l;fill()}};
document.getElementById("tabs").onclick=e=>{if(e.target.dataset.t){ti=+e.target.dataset.t;fill()}};
document.getElementById("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;const p=document.getElementById("pic");p.src=URL.createObjectURL(f);p.style.display="block"};
fill();

// 3D
const box=document.getElementById("v3d");
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);
const rd=new THREE.WebGLRenderer({antialias:true,alpha:true});
rd.setPixelRatio(Math.min(devicePixelRatio,2));box.appendChild(rd.domElement);
sc.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,8,6);sc.add(dl);
const car=new THREE.Group();sc.add(car);
const bodyM=new THREE.MeshPhongMaterial({color:0x7b2fbf,shininess:90});
const dark=new THREE.MeshPhongMaterial({color:0x111111}),glass=new THREE.MeshPhongMaterial({color:0x9fd3ff,transparent:true,opacity:.7,shininess:120});
function add(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);car.add(o);return o}
add(new THREE.BoxGeometry(5,.7,2),bodyM,0,.75,0);        // lower body
add(new THREE.BoxGeometry(1.8,.55,1.9),bodyM,-1.4,1.25,0); // trunk
add(new THREE.BoxGeometry(1.4,.4,1.9),bodyM,1.7,1.2,0);    // hood
add(new THREE.BoxGeometry(2,.6,1.75),glass,.1,1.6,0);      // cabin glass
add(new THREE.BoxGeometry(1.9,.08,1.7),bodyM,.1,1.93,0);   // roof
add(new THREE.BoxGeometry(5.05,.12,.5),dark,0,.38,0);      // underbody
add(new THREE.BoxGeometry(.06,.18,1.5),dark,2.52,.85,0);   // grille
[[-1,.15],[1,.15]].forEach(([s])=>{add(new THREE.BoxGeometry(.08,.14,.4),new THREE.MeshBasicMaterial({color:0xffffee}),2.52,.95,s*.8)});
add(new THREE.BoxGeometry(.06,.14,1.8),new THREE.MeshBasicMaterial({color:0xff1a1a}),-2.52,1,0);
const wg=new THREE.CylinderGeometry(.5,.5,.35,24),rg=new THREE.CylinderGeometry(.32,.32,.37,16),rm=new THREE.MeshPhongMaterial({color:0xcccccc,shininess:100});
[[1.6,1.05],[1.6,-1.05],[-1.6,1.05],[-1.6,-1.05]].forEach(([x,z])=>{
 const w=add(wg,dark,x,.5,z);w.rotation.x=Math.PI/2;
 const r=add(rg,rm,x,.5,z+(z>0?.01:-.01));r.rotation.x=Math.PI/2});
const floor=new THREE.Mesh(new THREE.CircleGeometry(5,48),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
floor.rotation.x=-Math.PI/2;floor.position.y=.01;sc.add(floor);
cam.position.set(0,3.2,9);cam.lookAt(0,1,0);
function size(){const w=box.clientWidth,h=box.clientHeight;rd.setSize(w,h);cam.aspect=w/h;cam.position.z=w<500?12:9;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
let drag=false,px=0,auto=true;
box.onpointerdown=e=>{drag=true;auto=false;px=e.clientX;box.setPointerCapture(e.pointerId)};
box.onpointerup=()=>{drag=false};
box.onpointermove=e=>{if(drag){car.rotation.y+=(e.clientX-px)*.01;px=e.clientX}};
document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>bodyM.color.set(s.dataset.c));
car.rotation.y=-.6;
(function loop(){requestAnimationFrame(loop);if(auto)car.rotation.y+=.006;rd.render(sc,cam)})();
</script>
</body>
</html>
